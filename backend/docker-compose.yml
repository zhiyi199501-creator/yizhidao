# 独占 80/443 时用（Docker 内 Caddy）。挂载 ./Caddyfile：
# 新加坡现役须先 cp Caddyfile.overseas Caddyfile；仓库默认 Caddyfile 是国内 yzd。
# 与系统 Caddy 共用端口时改用 docker-compose.prod.yml（遗留机，不是新加坡现役）。
services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      HEXAGRAMS_PATH: /app/data/Hexagrams.json
      DATABASE_URL: sqlite:////app/data/yizhidao.db
    volumes:
      - yizhidao_data:/app/data
    expose:
      - "8080"
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  yizhidao_data:
  caddy_data:
  caddy_config:
